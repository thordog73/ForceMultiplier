workflows:
  ios-validate:
    name: Force Multiplier — unsigned iOS validation
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Model, persistence and package checks
        script: npm test && npm run check
      - name: Bundle offline app and synchronize native plugins
        script: npm run ios:prepare
      - name: Compile for iOS Simulator (not signed or device-tested)
        script: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$CM_BUILD_DIR/ForceMultiplier-Simulator.zip" App.app
    artifacts:
      - ForceMultiplier-Simulator.zip
      - build/Logs/**
  ios-release:
    name: Force Multiplier — signed IPA + TestFlight
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/force-multiplier-*'
          include: true
          source: true
      cancel_previous_builds: false
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Force Multiplier App Store Connect
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fredesser.forcemultiplier
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install and verify
        script: npm ci && npm test && npm run check && npm run ios:prepare
      - name: Apply authorized signing profiles
        script: xcode-project use-profiles
      - name: Set unique build number
        script: |
          cd ios/App
          agvtool new-version -all "$(date -u +%Y%m%d%H%M%S)"
      - name: Create signed App Store IPA artifact
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
# One-button release branches now build, sign and upload to TestFlight.
# Public App Review submission remains disabled.

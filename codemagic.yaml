workflows:
  ios-validate:
    name: Force Multiplier — unsigned iOS validation
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Model, persistence and package checks
        script: npm test && npm run check
      - name: Bundle offline app and synchronize native plugins
        script: npm run ios:prepare
      - name: Compile for iOS Simulator (not signed or device-tested)
        script: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$CM_BUILD_DIR/ForceMultiplier-Simulator.zip" App.app
    artifacts:
      - ForceMultiplier-Simulator.zip
      - build/Logs/**
  ios-release:
    name: Force Multiplier — signed IPA + TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: ten-minute-wins-apple
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fredesser.forcemultiplier
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "6833361372"
    scripts:
      - name: Install and verify
        script: npm ci && npm test && npm run check && npm run ios:prepare
      - name: Apply authorized signing profiles
        script: xcode-project use-profiles
      - name: Set next unused TestFlight build number
        script: |
          set -euo pipefail
          LATEST="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS 2>/dev/null || true)"
          if ! echo "$LATEST" | grep -Eq '^[0-9]+$'; then LATEST=0; fi
          NEXT=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST; building: $NEXT"
          cd ios/App
          agvtool new-version -all "$NEXT"
      - name: Create signed App Store IPA artifact
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
# The Windows uploader starts ios-release directly through the Codemagic API.
# Webhook triggering is intentionally disabled to prevent duplicate builds.
# Public App Review submission remains disabled.

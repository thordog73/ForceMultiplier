ale exports, failed checks, and abnormal queues; route a useful alert to the responsible owner."}]},{"id":"close","title":"Escalate and Verify Incident Resolution","ids":["B19","B20"],"kicker":"Prove it works","outcome":"Create a useful incident handoff, rerun the user task and record evidence of restored operation.","why":"Closing a ticket because the server is green can leave the user unable to do their job.","steps":["Provide reproducible steps, error details, affected scope and business impact.","Request specific authorized assistance with the evidence attached.","Rerun the original user workflow and verify correct data/output before closure."],"scenario":"An import failure is fixed, but the user’s report remains empty because a filter is still wrong. Keep troubleshooting.","question":"What closes the incident properly?","answers":["Any healthy server dashboard","The affected user task succeeds with verified records and no unresolved blocker","The analyst stops receiving emails"],"answer":1,"answerWhy":"The user-facing outcome and record correctness are the final check.","advanced":"dbm:skill7","mission":7,"skills":[{"id":"B19","name":"Escalate with usable evidence","proof":"Provide reproducible steps, operational impact, relevant diagnostics, attempted actions, and the precise assistance required."},{"id":"B20","name":"Verify incident closure","proof":"Re-run the affected user task and check records and outputs; document any remaining issues or monitoring."}]}],"skills":[{"id":"B01","name":"Define the supported workflow","proof":"Translate an approved business need into users, inputs, operations, outputs, and observable acceptance conditions."},{"id":"B02","name":"Structure information for the workflow","proof":"Define necessary entities, identifiers, fields, relationships, and permitted values without needlessly duplicating the same fact."},{"id":"B03","name":"Maintain reference configuration","proof":"Apply approved changes to organizational units, resource categories, codes, or settings and verify the affected workflows."},{"id":"B04","name":"Translate duties into permissions","proof":"Build a role and scope matrix that permits approved work without unnecessary access."},{"id":"B05","name":"Provision authorized access","proof":"Link the correct identity, approved request, account, and permission scope; perform or route the action within assigned authority."},{"id":"B06","name":"Manage account lifecycle changes","proof":"Update access for arrivals, changed duties, departures, and expirations without accumulating obsolete permissions."},{"id":"B07","name":"Review effective access","proof":"Compare actual permissions, including supplied group inheritance, with current approvals and investigate discrepancies."},{"id":"B08","name":"Test access behavior","proof":"Verify that an authorized task succeeds and a specified unauthorized action remains restricted."},{"id":"B09","name":"Locate the failing layer","proof":"Use evidence to distinguish identity, permission, configuration, interface, application, or underlying service problems."},{"id":"B10","name":"Diagnose misleading views","proof":"Check filters, periods, scope, refresh state, and report settings before treating absent output as absent data."},{"id":"B11","name":"Reconstruct an incident","proof":"Correlate timestamps, transaction identifiers, logs, and user actions into a supported sequence of events."},{"id":"B12","name":"Control imports","proof":"Validate structure and mappings, stage the import, inspect rejections, and reconcile records that were only partly accepted."},{"id":"B13","name":"Recover interface failures","proof":"Identify rejected or delayed transfers, correct the supported cause, and verify delivery without duplication."},{"id":"B14","name":"Control configuration changes","proof":"Assess affected workflows, obtain required authorization, test a scoped change, and preserve the previous configuration."},{"id":"B15","name":"Verify restoration and rollback","proof":"Demonstrate that a backup or rollback restores the required records, configuration, and usable workflow."},{"id":"B16","name":"Maintain service during outages","proof":"Apply the supplied continuity process while preserving transaction identity, timing, ownership, and required controls."},{"id":"B17","name":"Reconcile the recovery backlog","proof":"Resume incomplete work without repeating committed transactions; verify that recovered records and outputs are correct."},{"id":"B18","name":"Monitor recurring system work","proof":"Detect missed jobs, stale exports, failed checks, and abnormal queues; route a useful alert to the responsible owner."},{"id":"B19","name":"Escalate with usable evidence","proof":"Provide reproducible steps, operational impact, relevant diagnostics, attempted actions, and the precise assistance required."},{"id":"B20","name":"Verify incident closure","proof":"Re-run the affected user task and check records and outputs; document any remaining issues or monitoring."}],"id":"dbm"}};

nce into one feasible aircraft-by-day plan; see which work should be consolidated.","proof":"Build and brief an executable 90-day aircraft-by-day checkerboard for a synthetic fleet; demonstrate one valid downtime consolidation, one disruption recovery, and a traceable record of limitations and approvals.","pitfall":"Treating a checkerboard as colored boxes instead of a capacity-constrained decision tool; bundling tasks without validating tech data; double-booking a dock; scheduling NMC, Phase, HQ-restricted or depot aircraft as flyers.","scenario":"Two paint actions and an inspection are due in the same period; compare separate downtime to an authorized consolidated window.","fundamentals":["Translate annual FHP into quarterly, monthly, weekly, and daily sorties and flying hours. Know the mission, turns, spares, utilization and realistic turnaround constraints.","Start with accurate aircraft status, mission capability, configuration, upcoming TCI/TCTO/SI/calendar events, Phase hours, PDM/depot, engine work and overdue items.","Establish workable capacity: maintenance personnel and qualifications, shops, test equipment, hangar/dock space, parts/ETICs, holidays, local flying windows and coordination requirements.","Plot each tail across the planned period using standardized codes; distinguish confirmed maintenance, forecasts, assumptions and unavailable or restricted aircraft.","Consolidate compatible inspections and modifications into shared downtime windows when instructions and resources allow. Respect sequence, safety, cure/hold times and approvals; do not erase required work.","Balance Phase flow, aircraft rotation and Hangar Queen risk; do not hide future downtime to make the current week look better.","Resolve overlaps and bottlenecks, protect spares, and show shortfalls/options before the schedule is approved by the proper authority.","Publish a controlled approved baseline. During execution, log deviations, apply authorized changes, reconcile sorties/work accomplished and update the next forecast."],"related":[{"id":"S01","name":"Translate requirements across planning horizons","proof":"Convert annual, quarterly, monthly, or weekly requirements into daily demand; reconcile the detailed schedule with required output rather than treating each planning period as a separate skill."},{"id":"S02","name":"Establish the planning picture and constraints","proof":"Verify availability, requirements, source dates, and estimates; distinguish confirmed facts, assumptions, mandatory limits, and negotiable preferences before allocating work."},{"id":"S06","name":"Build an integrated schedule","proof":"Build a checkerboard showing flying, reserve, maintenance, and unavailable periods; synchronize people, aircraft, tools, space, and capacity without conflicting assignments."},{"id":"S08","name":"Find and use genuine scheduling opportunities","proof":"Inspect idle windows and holes; fit eligible work after checking duration, dependencies, capability, and resources, and recognize when a gap must remain unfilled."},{"id":"S09","name":"Combine compatible work and reduce setup","proof":"Compare bundles and sequences that reduce repeated access, setup, changeovers, downtime, or cure only when supplied instructions permit; preserve every requirement and verify the actual time or capacity saved."}],"mission":1,"advanced":"scheduling:skill7","refNames":["CAFI 21-165 (historical CAF scheduling)","AFI 21-101 ACCSUP Ch. 14","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_scheduling-02","section":"fgs_scheduling","group":"FGS Scheduling","discipline":"scheduling","color":"#1f5aa9","title":"AVDO / PIC Changes","moduleArea":"scheduling","moduleId":"control","definition":"Maintain accountable aircraft possession and in-commission status when aircraft arrive, depart, or change reporting responsibility.","proof":"Reconcile the approved inventory change, effective time, new status, and affected planning/reporting totals.","pitfall":"Treating a reported move as completed without the approved transfer or effective-date evidence.","scenario":"An aircraft transfers midmonth while the schedule and utilization totals still show it as possessed.","fundamentals":["Record the approver, current schedule version and controlled changes.","Reconcile sorties, flying hours, aircraft utilization and maintenance completion against plan.","Explain variances, emerging risks, and what the next cycle must change."],"related":[{"id":"S19","name":"Obtain approval and control the approved schedule","proof":"Present the feasible schedule and unresolved exceptions to the designated authority; verify signatures and version, publish the approved schedule, and route subsequent changes through the required approval process."},{"id":"S20","name":"Reconcile execution and improve the next plan","proof":"Compare delivered output, actual duration, usage, and downtime with the approved plan; investigate differences, retain unresolved explanations, and carry justified corrections into the next planning cycle."}],"mission":1,"advanced":"scheduling:skill8","refNames":["CAFI 21-165 (historical CAF scheduling)","AFI 21-101 ACCSUP Ch. 14","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_scheduling-03","section":"fgs_scheduling","group":"FGS Scheduling","discipline":"scheduling","color":"#1f5aa9","title":"AF Forms 2407 / 2410","moduleArea":"scheduling","moduleId":"control","definition":"Interpret and reconcile the legacy forms/data products identified in the unit task list; verify the current authorized equivalent before teaching field-level procedures.","proof":"Locate the authoritative procedure, identify required fields, validate dates and totals, and show what record changed.","pitfall":"Assuming a historical form name guarantees the same current workflow or inventing its purpose.","scenario":"A supervisor finds mismatched figures on a legacy scheduling report and the system of record.","fundamentals":["Record the approver, current schedule version and controlled changes.","Reconcile sorties, flying hours, aircraft utilization and maintenance completion against plan.","Explain variances, emerging risks, and what the next cycle must change."],"related":[{"id":"S19","name":"Obtain approval and control the approved schedule","proof":"Present the feasible schedule and unresolved exceptions to the designated authority; verify signatures and version, publish the approved schedule, and route subsequent changes through the required approval process."},{"id":"S20","name":"Reconcile execution and improve the next plan","proof":"Compare delivered output, actual duration, usage, and downtime with the approved plan; investigate differences, retain unresolved explanations, and carry justified corrections into the next planning cycle."}],"mission":1,"advanced":"scheduling:skill8","refNames":["CAFI 21-165 (historical CAF scheduling)","AFI 21-101 ACCSUP Ch. 14","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_scheduling-04","section":"fgs_scheduling","group":"FGS Scheduling","discipline":"scheduling","color":"#1f5aa9","title":"Pre-Documentation Meetings","moduleArea":"scheduling","moduleId":"recover","definition":"Prepare decisions before the formal scheduling meeting, not merely a slide deck.","proof":"Bring demand, known conflicts, parts, manpower and aircraft capability; leave with assigned actions and suspense dates.","pitfall":"Meeting without source information, decisions, owners or follow-up.","scenario":"Operations requests two extra sorties; Production identifies a late critical part before the weekly plan is approved.","fundamentals":["Identify exactly what changed: ETIC, part arrival, mission demand, manpower or aircraft status.","Recompute what can fly, what can be maintained and what must move; distinguish feasible from desired output.","Coordinate with Production, Operations, MOC and specialists; capture alternatives, owners and due actions."],"related":[{"id":"S17","name":"Recover a disrupted schedule","proof":"After an outage, late part, changed requirement, or duration overrun, trace dependencies, test contingencies, restore feasibility, and communicate necessary changes while preserving unaffected commitments."},{"id":"S18","name":"Run a scheduling meeting that produces decisions","proof":"Prepare the plan and unresolved issues, reconcile stakeholder requirements, surface conflicts, record decisions and tradeoffs, and assign owners, deadlines, and follow-up actions."}],"mission":2,"advanced":"scheduling:skill8","refNames":["CAFI 21-165 (historical CAF scheduling)","AFI 21-101 ACCSUP Ch. 14","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_scheduling-05","section":"fgs_scheduling","group":"FGS Scheduling","discipline":"scheduling","color":"#1f5aa9","title":"AFTO Form 103","moduleArea":"scheduling","moduleId":"control","definition":"Recognize when the locally identified AFTO 103 record is applicable and verify completion against current form instructions and source evidence.","proof":"Show correct source, reconciliation and routing for a fictional case without assuming older form procedures still apply.","pitfall":"Transcribing a value without checking its definition, effective period and controlled reference.","scenario":"The published form and system entry disagree on an asset's recorded utilization.","fundamentals":["Record the approver, current schedule version and controlled changes.","Reconcile sorties, flying hours, aircraft utilization and maintenance completion against plan.","Explain variances, emerging risks, and what the next cycle must change."],"related":[{"id":"S19","name":"Obtain approval and control the approved schedule","proof":"Present the feasible schedule and unresolved exceptions to the designated authority; verify signatures and version, publish the approved schedule, and route subsequent changes through the required approval process."},{"id":"S20","name":"Reconcile execution and improve the next plan","proof":"Compare delivered output, actual duration, usage, and downtime with the approved plan; investigate differences, retain unresolved explanations, and carry justified corrections into the next planning cycle."}],"mission":1,"advanced":"scheduling:skill8","refNames":["CAFI 21-165 (historical CAF scheduling)","AFI 21-101 ACCSUP Ch. 14","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_scheduling-06","section":"fgs_scheduling","group":"FGS Scheduling","discipline":"scheduling","color":"#1f5aa9","title":"Overdues / Missing / Wrong Entries","moduleArea":"scheduling","moduleId":"planned","definition":"Find maintenance requirements that are overdue, absent, duplicated or incorrectly coded before they distort the schedule.","proof":"Create a prioritized exception list with source, due point, impact, owner and required correction/escalation.","pitfall":"Silently erasing or postponing overdue work.","scenario":"A weekly checkerboard omits a time-change requirement that becomes due Thursday.","fundamentals":["Identify inspection, TCI, TCTO and modification due windows and the correct operating-hour or calendar clock.","Check prerequisite parts, qualified labor, tools, dock capacity and work sequence.","Place work before the due point; combine related jobs when approved, including necessary curing and reassembly.","Commit planned downtime only after checking readiness; maintain a record of why it was scheduled."],"related":[{"id":"S07","name":"Sequence work using the correct clocks and deadlines","proof":"Work backward through prerequisites, execution, staffed calendars, elapsed waiting, cure, and verification; calculate feasible start and finish times, the la ,"fundamentals":["Convert annual, monthly and weekly flying requirements into daily demand and required availability.","Mark known downtime, overdue or approaching inspections, Phase windows, depot moves, NMC status, manpower, parts and facilities.","Find usable maintenance opportunities; group work that can share access, downtime or setup without violating instructions.","Condense compatible PFR and PBG work so a common cure happens once only when authorized. Preserve two workdays per task and a full 24-hour cure."],"related":[{"id":"S01","name":"Translate requirements across planning horizons","proof":"Convert annual, quarterly, monthly, or weekly requirements into daily demand; reconcile the detailed schedule with required output rather than treating each planning period as a separate skill."},{"id":"S02","name":"Establish the planning picture and constraints","proof":"Verify availability, requirements, source dates, and estimates; distinguish confirmed facts, assumptions, mandatory limits, and negotiable preferences before allocating work."},{"id":"S06","name":"Build an integrated schedule","proof":"Build a checkerboard showing flying, reserve, maintenance, and unavailable periods; synchronize people, aircraft, tools, space, and capacity without conflicting assignments."},{"id":"S08","name":"Find and use genuine scheduling opportunities","proof":"Inspect idle windows and holes; fit eligible work after checking duration, dependencies, capability, and resources, and recognize when a gap must remain unfilled."},{"id":"S09","name":"Combine compatible work and reduce setup","proof":"Compare bundles and sequences that reduce repeated access, setup, changeovers, downtime, or cure only when supplied instructions permit; preserve every requirement and verify the actual time or capacity saved."}],"mission":1,"advanced":"scheduling:skill7","refNames":["CAFI 21-165 (historical CAF scheduling)","AFI 21-101 ACCSUP Ch. 14","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based re removed for review or action so no requirement disappears.","proof":"Maintain custody, reason, suspense, and proof of return/replacement or approved correction.","pitfall":"Losing document history or using an untracked working copy as authoritative.","scenario":"A required controlled record is pulled for correction while the weekly plan is being finalized.","fundamentals":["Record the approver, current schedule version and controlled changes.","Reconcile sorties, flying hours, aircraft utilization and maintenance completion against plan.","Explain variances, emerging risks, and what the next cycle must change."],"related":[{"id":"S19","name":"Obtain approval and control the approved schedule","proof":"Present the feasible schedule and unresolved exceptions to the designated authority; verify signatures and version, publish the approved schedule, and route subsequent changes through the required approval process."},{"id":"S20","name":"Reconcile execution and improve the next plan","proof":"Compare delivered output, actual duration, usage, and downtime with the approved plan; investigate differences, retain unresolved explanations, and carry justified corrections into the next planning cycle."}],"mission":1,"advanced":"scheduling:skill8","refNames":["CAFI 21-165 (historical CAF scheduling)","AFI 21-101 ACCSUP Ch. 14","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_scheduling-10","section":"fgs_scheduling","group":"FGS Scheduling","discipline":"scheduling","color":"#1f5aa9","title":"Load Sorties","moduleArea":"scheduling","moduleId":"daily","definition":"Correctly enter and reconcile authorized flying demand, including first wave, turns, spares and planned utilization.","proof":"Match sorties to tail, date, authorized schedule version, mission needs and realistic aircraft/turn capability.","pitfall":"Double-loading a tail or counting an unauthorized sortie as approved demand.","scenario":"Six first-wave aircraft must produce four turns, but one goes NMC before launch.","fundamentals":["Read the aircraft-by-aircraft status and configuration; identify required mission/turn capability.","Select six FMC first-wave aircraft; choose four of those aircraft for turns.","For larger requirements, schedule 12 first-wave aircraft plus ten turns and protect the designated spare.","Recheck the lineup after an aircraft abort, NMC change or priority mission."],"related":[{"id":"S03","name":"Match capable resources to the assignment","proof":"Select six eligible first-go aircraft and four feasible turn aircraft in a 6-turn-4 exercise; satisfy capability, configuration, turnaround, usage, and support constraints, preserving scarce capabilities for work that needs them."},{"id":"S04","name":"Plan spares and contingencies","proof":"Select an eligible spare or capacity margin, test credible duration and arrival delays, and place buffers or contingencies without double-counting resources or concealing a shortfall."}],"mission":1,"advanced":"scheduling:skill1","refNames":["CAFI 21-165 (historical CAF scheduling)","AFI 21-101 ACCSUP Ch. 14","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_scheduling-11","section":"fgs_scheduling","group":"FGS Scheduling","discipline":"scheduling","color":"#1f5aa9","title":"Phase Flow","moduleArea":"scheduling","moduleId":"phase","definition":"Forecast recurring inspection entry using hours remaining, projected utilization and available dock capacity.","proof":"Show hours remaining by tail, forecast week/dock entry, expected downtime and impact of each flying choice.","pitfall":"Flying only the closest-to-Phase aircraft or overusing high-hour aircraft until the rest become hangar queens.","scenario":"Two tails approach Phase with one available dock; rebalance usage without creating an HQ.","fundamentals":["Read hours remaining to Phase for every eligible aircraft and anticipate use in the next period.","Estimate expected hours burned by first-wave and turn decisions; identify clusters approaching the limit.","Balance low-hour and high-hour aircraft and protect the aircraft approaching 30 days without flying.","Explain the capacity effect if two aircraft become due together."],"related":[{"id":"S05","name":"Manage utilization and prevent prolonged inactivity","proof":"Track use and time since last use; rotate eligible aircraft or plan recovery before the supplied non-use threshold, avoiding a hangar queen while preserving mission capability and required reserves."},{"id":"S15","name":"Balance utilization and recurring workload","proof":"Build and fix phase flow by projecting hours, cycles, and due points against dock capacity; rebalance permitted utilization or inspection entries. Apply the same cumulative-use logic to other allowances and inventory."}],"mission":3,"advanced":"scheduling:skill4","refNames":["CAFI 21-165 (historical CAF scheduling)","AFI 21-101 ACCSUP Ch. 14","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"wing_scheduling-01","section":"wing_scheduling","group":"Wing Scheduling","discipline":"scheduling","color":"#17637e","title":"Wing AVDO","moduleArea":"scheduling","moduleId":"control","definition":"Reconcile wing aircraft inventory, possession, status and accountable reporting changes across units.","proof":"Prepare a source-supported wing inventory/status view tied to actual effective dates and approvals.","pitfall":"Summing unit counts without reconciling transfers, deployed assets or time periods.","scenario":"Two units both count an aircraft during its transfer week.","fundamentals":["Record the approver, current schedule version and controlled changes.","Reconcile sorties, flying hours, aircraft utilization and maintenance completion against plan.","Explain variances, emerging risks, and what the next cycle must change."],"related":[{"id":" ition and workflow for the unit's MSM task and teach source-based quality control.","proof":"Demonstrate timely, complete, authorized product preparation after the meaning is verified.","pitfall":"Teaching an invented acronym expansion as official policy.","scenario":"The wing asks for MSM before an assessment but the product owner and source are unclear.","fundamentals":["Assemble open requirements, completed evidence, pending exceptions, due dates and owners.","Keep current records available and apply approved retention rules and holds.","Explain unresolved issues and the next action, rather than passing on an ambiguous green dashboard."],"related":[{"id":"D19","name":"Produce a usable handover","proof":"Assemble a retrievable package showing status, evidence, open issues, and continuing responsibilities."},{"id":"D20","name":"Apply retention and holds","proof":"Retain, freeze, archive, or dispose of records according to the supplied authorized rules and any applicable hold."}],"mission":4,"advanced":"doc:home","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"wing_documentation-08","section":"wing_documentation","group":"Wing Documentation","discipline":"documentation","color":"#aa249d","title":"Out-of-Cycle Request","moduleArea":"documentation","moduleId":"changes","definition":"Assess and route an exceptional maintenance or reporting change outside the normal schedule.","proof":"State reason, scope, approval authority, mission impact and resulting record changes.","pitfall":"Treating a request as approval or skipping required coordination.","scenario":"An urgent mission requires moving work from the approved weekly plan.","fundamentals":["Check exception authority, scope, effective date and duration.","Determine what changed under a revision and which records must be updated or superseded.","Record unresolved conflicts and identify the approving authority."],"related":[{"id":"D14","name":"Handle exceptions","proof":"Recognize when a waiver or extension needs an authorized decision; record its scope, conditions, and expiration."},{"id":"D15","name":"Assess requirement changes","proof":"Identify the records affected by changed guidance and apply the supplied effective-date and transition rules."}],"mission":4,"advanced":"doc:term","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_analysis-01","section":"fgs_analysis","group":"FGS Analysis","discipline":"analysis","color":"#1f5aa9","title":"Health of the Fleet (HOF)","moduleArea":"analysis","moduleId":"brief","definition":"Translate aircraft availability, recurring problems, inspections and trends into a credible fleet-health narrative.","proof":"Give the commander a sourced snapshot of current capability, principal drivers, near-term risks and recommended decisions.","pitfall":"Calling the fleet healthy solely because one headline rate is green.","scenario":"MC improves while three aircraft approach Phase together and repeat faults increase.","fundamentals":["Forecast fleet capability against flying or maintenance requirements and stress-test assumptions.","Compare countermeasures, costs, opportunities and adverse consequences.","Brief the decision, confidence, risks and sources; check whether action improved the result."],"related":[{"id":"A17","name":"Assess and project capability against requirements","proof":"Prepare an annual capability assessment using resources, anticipated availability, limiting constraints, and explicit assumptions; estimate feasible output, identify requirement gaps, and present plausible scenarios."},{"id":"A18","name":"Compare options and test sensitivity","proof":"Compare proposed actions and tradeoffs; determine whether the preferred action changes when important assumptions, constraints, or estimates change."},{"id":"A19","name":"Brief results and defend recommendations","proof":"Prepare and defend a health-of-fleet or equivalent briefing that connects current condition, output, trends, drivers, uncertainty, forecast risks, and required decisions using traceable evidence."},{"id":"A20","name":"Verify the result of action","proof":"Define success before acting; compare subsequent evidence on a valid basis and revise the recommendation when results or assumptions change."}],"mission":5,"advanced":"analysis:sim6","refNames":["ACCI 21-118 (2018 archive)","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_analysis-02","section":"fgs_analysis","group":"FGS Analysis","discipline":"analysis","color":"#1f5aa9","title":"MAJCOM reports Numbers","moduleArea":"analysis","moduleId":"rates","definition":"Apply correct reporting definitions, populations and formulas to maintenance metrics used in the MAJCOM reports process.","proof":"Reconcile numerators, denominators, rates, period and aircraft population to source records.","pitfall":"Using sortie counts as the denominator for every maintenance rate.","scenario":"Two of ten breaks are fixed inside eight hours; determine the proper 8-hour fix rate.","fundamentals":["Identify count versus rate; use approved definitions and compatible units.","Compute break rate from qualifying breaks and flights; fix rate from quick repairs and qualifying breaks; repeat rate from repeats and PRDs; CANN rate from cann actions and flights.","Roll up by summing appropriate numerators and denominators, not by blindly averaging percentages.","Reconcile daily, weekly and monthly reports to the underlying source."],"related":[{"id":"A03","name":"Define and calculate the right metric","proof":"Recognize measurement type and meaning; specify numerator, eligible denominator, exposure, units, and approved formula. Distinguish a status snapshot from activity accumulated during a period."},{"id":"A04","name":"Aggregate and roll up correctly","proof":"Pool eligible counts or apply justified weights; produce valid group and period summaries without averaging incompatible percentages or double-counting overlapping periods."},{"id":"A05","name":"Produce and reconcile recurring reports","proof":"Provide daily, weekly, monthly, and annual numbers with consistent definitions and cutoffs; reconcile source detail with published totals and explain late entries, revisions, or unresolved differences."}],"mission":5,"advanced":"analysis:metric","refNames":["ACCI 21-118 (2018 archive)","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_analysis-03","section":"fgs_analysis","group":"FGS Analysis","discipline":"analysis","color":"#1f5aa9","title":"Special Studies","moduleArea":"analysis","moduleId":"drivers","definition":"Investigate a focused operational question using valid data, alternatives and independent checks.","proof":"Define the problem, select measures, isolate candidate drivers, evaluate hypotheses and produce useful recommendations.","pitfall":"Declaring a root cause based on the first correlation found.","scenario":"One unit shows rising downtime; distinguish supply delays from repeat maintenance failures.","fundamentals":["Locate which subsystems, aircraft or causes account for the observed burden.","Separate verified facts from hypotheses and alternatives.","Use a fishbone and plan a test that could falsify the favored explanation."],"related":[{"id":"A11","name":"Identify and report contributing drivers","proof":"Separate relevant groups and quantify their contributions to lost time, changed output, or other results; report concentrations and case-mix changes while distinguishing measured contributors from suspected causes."},{"id":"A12","name":"Present evidence honestly","proof":"Choose suitable displays with clear populations, periods, units, denominators, labels, and scales; make the important comparison understandable without distortion."},{"id":"A13","name":"Develop testable explanations","proof":"Distinguish association from cause, consider alternatives, and use a fishbone or similar investigation structure; turn suspected causes into predictions and identify evidence that could support or contradict them."}],"mission":5,"advanced":"analysis:sim4","refNames":["ACCI 21-118 (2018 archive)","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_analysis-04","section":"fgs_analysis","group":"FGS Analysis","discipline":"analysis","color":"#1f5aa9","title":"Daily Numbers","moduleArea":"analysis","moduleId":"rates","definition":"Reconcile daily production and maintenance data without losing scope, timing or source definitions.","proof":"Prepare a correct daily report and identify unusual shifts and missing data requiring review.","pitfall":"Mixing yesterday's completions with today's open records.","scenario":"The daily rate falls while the number of sorties doubles.","fundamentals":["Identify count versus rate; use approved definitions and compatible units.","Compute break rate from qualifying breaks and flights; fix rate from quick repairs and qualifying breaks; repeat rate from repeats and PRDs; CANN rate from cann actions and flights.","Roll up by summing appropriate numerators and denominators, not by blindly averaging percentages.","Reconcile daily, weekly and monthly reports to the underlying source."],"related":[{"id":"A03","name":"Define and calculate the right metric","proof":"Recognize measurement type and meaning; specify numerator, eligible denominator, exposure, units, and approved formula. Distinguish a status snapshot from activity accumulated during a period."},{"id":"A04","name":"Aggregate and roll up correctly","proof":"Pool eligible counts or apply justified weights; produce valid group and period summaries without averaging incompatible percentages or double-counting overlapping periods."},{"id":"A05","name":"Produce and reconcile recurring reports","proof":"Provide daily, weekly, monthly, and annual numbers with consistent definitions and cutoffs; reconcile source detail with published totals and explain late entries, revisions, or unresolved differences."}],"mission":5,"advanced":"analysis:metric","refNames":["ACCI 21-118 (2018 archive)","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"fgs_analysis-05","section":"fgs_analysis","group":"FGS Analysis","discipline":"analysis","color":"#1f5aa9","title":"Weekly Numbers","moduleArea":"analysis","moduleId":"trends","definition":"Aggregate daily data into a consistent week and identify a useful signal.","proof":"Recompute totals, compatible rates and changes from the previous week; explain unusual events.","pitfall":"Taking an average of daily percentages with different denominators.","scenario":"Three high-volume days and two low-volume days show similar percentages; compute the true weekly rate.","fundamentals":["Plot comparable measures over time and mark changes in definition.","Set an evidence-based baseline or candidate standard from valid historical data.","Look for sustained patterns and ask whether the signal is operationally meaningful."],"related":[{"id":"A08","name":"Read change over time","proof":"Examine trends, persistence, recurring cycles, and workload changes; distinguish a sustained pattern from an isolated period."},{"id":"A09","name":"Establish historical baselines and propose standards","proof":"Use representative historical data to establish a baseline and propose a defensible benchmark or performance standard; explain limitations and distinguish observed performance, proposed targets, and authorized requirements."},{"id":"A10","name":"Evaluate apparent signals","proof":"Monitor variation against an appropriate baseline and stated decision rule; identify results requiring investigation without treatin cators, significant drivers, forecast risk and a defensible action to senior leaders.","proof":"Deliver a concise brief that withstands denominator, source and alternative-explanation questions.","pitfall":"Overstating certainty or using charts that disguise an unresolved data-quality issue.","scenario":"A skeptical commander asks which two actions would have the most supportable effect.","fundamentals":["Forecast fleet capability against flying or maintenance requirements and stress-test assumptions.","Compare countermeasures, costs, opportunities and adverse consequences.","Brief the decision, confidence, risks and sources; check whether action improved the result."],"related":[{"id":"A17","name":"Assess and project capability against requirements","proof":"Prepare an annual capability assessment using resources, anticipated availability, limiting constraints, and explicit assumptions; estimate feasible output, identify requirement gaps, and present plausible scenarios."},{"id":"A18","name":"Compare options and test sensitivity","proof":"Compare proposed actions and tradeoffs; determine whether the preferred action changes when important assumptions, constraints, or estimates change."},{"id":"A19","name":"Brief results and defend recommendations","proof":"Prepare and defend a health-of-fleet or equivalent briefing that connects current condition, output, trends, drivers, uncertainty, forecast risks, and required decisions using traceable evidence."},{"id":"A20","name":"Verify the result of action","proof":"Define success before acting; compare subsequent evidence on a valid basis and revise the recommendation when results or assumptions change."}],"mission":5,"advanced":"analysis:sim6","refNames":["ACCI 21-118 (2018 archive)","DAFI 21-101 Ch. 5 and Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-01","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"Hush House","moduleArea":"scheduling","moduleId":"capacity","definition":"Coordinate engine test-facility demand, shared resources and work dependencies in the maintenance plan.","proof":"Show authorized facility time, prerequisites, conflicts, available support and contingency.","pitfall":"Double-booking a test facility or assuming the maintenance event is complete after the slot is reserved.","scenario":"Two engines need test runs during a single available facility window.","fundamentals":["Map bottlenecks: inspection docks, specialist labor, tools, parts, facility restrictions and shared assets.","Preserve required reserves, dependencies and protected windows; identify donor/recovery effects when an aircraft is unavailable.","Quantify the mission impact of moving work and offer choices when demand exceeds capacity."],"related":[{"id":"S14","name":"Plan use and recovery of unavailable resources","proof":"In a cann-bird case with multiple parts delays, compare keeping, recovering, or using an eligible donor; assess total capability, required authority, added work, parts dependencies, and the donor recovery plan."},{"id":"S16","name":"Protect bottlenecks and make capacity tradeoffs","proof":"Identify the resource limiting output; compare feasible allocations against stated priorities and report the system-wide gain, unmet demand, displaced work, and consequences."}],"mission":3,"advanced":"scheduling:skill8","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-02","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"Bump: CDAT, CEMS, IMDS","moduleArea":"integrity","moduleId":"reconcile","definition":"Keep engine status/configuration and related maintenance records synchronized across designated systems, subject to authorized local processes.","proof":"Trace one event through source record, system status, correction authority and Scheduling for downtime."],"related":[{"id":"D04","name":"Establish the due point","proof":"Calculate the deadline from the correct trigger, units, calendar, and authorized rule."},{"id":"D05","name":"Manage recurrence","proof":"Calculate the next obligation from the correct verified accomplishment or other anchor specified in the governing rule."},{"id":"D06","name":"Recognize prerequisites","proof":"Keep a dependent action open when the required predecessor or supporting evidence has not been established."}],"mission":4,"advanced":"doc:inspection","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-04","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"Waivers Needed","moduleArea":"documentation","moduleId":"changes","definition":"Identify an exception requiring authorized review before an engine/work requirement can proceed.","proof":"State need, justification, applicable limit, operational risk, owner and decision authority.","pitfall":"Treating an expiring limit as automatically waived when request paperwork exists.","scenario":"An inspection cannot be accomplished before the planned sortie surge.","fundamentals":["Check exception authority, scope, effective date and duration.","Determine what changed under a revision and which records must be updated or superseded.","Record unresolved conflicts and identify the approving authority."],"related":[{"id":"D14","name":"Handle exceptions","proof":"Recognize when a waiver or extension needs an authorized decision; record its scope, conditions, and expiration."},{"id":"D15","name":"Assess requirement changes","proof":"Identify the records affected by changed guidance and apply the supplied effective-date and transition rules."}],"mission":4,"advanced":"doc:term","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-05","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"Waivers Processed","moduleArea":"documentation","moduleId":"closeout","definition":"Verify actual approval, scope, dates and restrictions of waiver decisions before relying on them.","proof":"Reconcile approved or denied status to the correct engine/requirement and communicate limits.","pitfall":"Confusing requested, recommended and approved status.","scenario":"The waiver has approval for one serial but planners applied it to three.","fundamentals":["Distinguish a request, scheduled work, actual execution, verified accomplishment and authorized closeout.","Evaluate records and supporting evidence, including partial work and continuing restrictions.","Escalate incomplete or unsupported records instead of marking everything finished."],"related":[{"id":"D10","name":"Distinguish workflow states","proof":"Keep requested, scheduled, approved, performed, verified, and closed states separate when the exercise requires them."},{"id":"D11","name":"Verify closeout","proof":"Check the required completion details and authorized sign-off against the stated evidence standard before reporting completion."},{"id":"D12","name":"Handle partial accomplishment","proof":"Close supported portions while keeping unfinished obligations and their remaining requirements visible."},{"id":"D13","name":"Control unresolved work","proof":"Assign missing evidence or unfinished actions an owner, next action, due date, and recheck point."}],"mission":4,"advanced":"doc:home","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-06","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"Meetings","moduleArea":"scheduling","moduleId":"recover","definition":"Use engine-management meetings to coordinate accurate fleet status, due work and resource decisions.","proof":"Enter with current serial-by-serial status and leave with actions, owners and deadlines.","pitfall":"Showing slides without a resourced executable action plan.","scenario":"An engine shortage requires prioritizing two competing missions.","fundamentals":["Identify exactly what changed: ETIC, part arrival, mission demand, manpower or aircraft status.","Recompute what can fly, what can be maintained and what must move; distinguish feasible from desired output.","Coordinate with Production, Operations, MOC and specialists; capture alternatives, owners and due actions."],"related":[{"id":"S17","name":"Recover a disrupted schedule","proof":"After an outage, late part, changed requirement, or duration overrun, trace dependencies, test contingencies, restore feasibility, and communicate necessary changes while preserving unaffected commitments."},{"id":"S18","name":"Run a scheduling meeting that produces decisions","proof":"Prepare the plan and unresolved issues, reconcile stakeholder requirements, surface conflicts, record decisions and tradeoffs, and assign owners, deadlines, and follow-up actions."}],"mission":2,"advanced":"scheduling:skill8","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-07","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"Shared Resources","moduleArea":"scheduling","moduleId":"capacity","definition":"Schedule common engine tools, facilities, crews and parts without hidden conflicts.","proof":"Show resource usage, maintenance dependencies, alternate options and critical risks.","pitfall":"Assuming equipment is available because it is not shown on the aircraft checkerboard.","scenario":"A shared tester is booked at the same time for two engines.","fundamentals":["Map bottlenecks: inspection docks, specialist labor, tools, parts, facility restrictions and shared assets.","Preserve required reserves, dependencies and protected windows; identify donor/recovery effects when an aircraft is unavailable.","Quantify the mission impact of moving work and offer choices when demand exceeds capacity."],"related":[{"id":"S14","name":"Plan use and recovery of unavailable resources","proof":"In a cann-bird case with multiple parts delays, compare keeping, recovering, or using an eligible donor; assess total capability, required authority, added work, parts dependencies, and the donor recovery plan."},{"id":"S16","name":"Protect bottlenecks and make capacity tradeoffs","proof":"Identify the resource limiting output; compare feasible allocations against stated priorities and report the system-wide gain, unmet demand, displaced work, and consequences."}],"mission":3,"advanced":"scheduling:skill8","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-08","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"MXG Group Meeting","moduleArea":"scheduling","moduleId":"recover","definition":"Translate engine fleet status into concise group-level risk and decision requests.","proof":"Brief available engines, upcoming inspections, mission impact, options and ownership.","pitfall":"Reporting only total engines without serviceability and forecast context.","scenario":"The group asks how many engines will be available next week and what might change that number.","fundamentals":["Identify exactly what changed: ETIC, part arrival, mission demand, manpower or aircraft status.","Recompute what can fly, what can be maintained and what must move; distinguish feasible from desired output.","Coordinate with Production, Operations, MOC and specialists; capture alternatives, owners and due actions."],"related":[{"id":"S17","name":"Recover a disrupted schedule","proof":"After an outage, late part, changed requirement, or duration overrun, trace dependencies, test contingencies, restore feasibility, and communicate necessary changes while preserving unaffected commitments."},{"id":"S18","name":"Run a scheduling meeting that produces decisions","proof":"Prepare the plan and unresolved issues, reconcile stakeholder requirements, surface conflicts, record decisions and tradeoffs, and assign owners, deadlines, and follow-up actions."}],"mission":2,"advanced":"scheduling:skill8","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-09","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"Engine HOF","moduleArea":"analysis","moduleId":"brief","definition":"Explain engine fleet health using valid status, inspection flow, reliability and support indicators.","proof":"Produce a serial-level source-backed forecast and principal risk summary.","pitfall":"Relying on one FMC count that conceals clustered removals or overdue items.","scenario":"Three engines are ready today but all have near-term inspections.","fundamentals":["Forecast fleet capability against flying or maintenance requirements and stress-test assumptions.","Compare countermeasures, costs, opportunities and adverse consequences.","Brief the decision, confidence, risks and sources; check whether action improved the result."],"related":[{"id":"A17","name":"Assess and project capability against requirements","proof":"Prepare an annual capability assessment using resources, anticipated availability, limiting constraints, and explicit assumptions; estimate feasible output, identify requirement gaps, and present plausible scenarios."},{"id":"A18","name":"Compare options and test sensitivity","proof":"Compare proposed actions and tradeoffs; determine whether the preferred action changes when important assumptions, constraints, or estimates change."},{"id":"A19","name":"Brief results and defend recommendations","proof":"Prepare and defend a health-of-fleet or equivalent briefing that connects current condition, output, trends, drivers, uncertainty, forecast risks, and required decisions using traceable evidence."},{"id":"A20","name":"Verify the result of action","proof":"Define success before acting; compare subsequent evidence on a valid basis and revise the recommendation when results or assumptions change."}],"mission":5,"advanced":"analysis:sim6","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-10","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"Weekly Scheduling MXG","moduleArea":"scheduling","moduleId":"checkerboard","definition":"Reconcile engine work with the wing’s approved weekly aircraft and facility plans.","proof":"Integrate removals, installs, testing, parts, capability and needed approvals.","pitfall":"Moving engine work without updating the affected flying plan.","scenario":"An engine swap conflicts with a scheduled high-priority sortie.","fundamentals":["Convert annual, monthly and weekly flying requirements into daily demand and required availability.","Mark known downtime, overdue or approaching inspections, Phase windows, depot moves, NMC status, manpower, parts and facilities.","Find usable maintenance opportunities; group work that can share access, downtime or setup without violating instructions.","Condense compatible PFR and PBG work so a common cure happens once only when authorized. Preserve two workdays per task and a full 24-hour cure."],"related":[{"id":"S01","name":"Translate requirements across planning horizons","proof":"Convert annual, quarterly, monthly, or weekly requirements into daily demand; reconcile the detailed schedule with required output rather than treating each planning period as a separate skill."},{"id":"S02","name":"Establish the planning picture and constraints","proof":"Verify availability, requirements, source dates, and estimates; distinguish confirmed facts, assumptions, mandatory limits, and negotiable preferences before allocating work."},{"id":"S06","name":"Build an integrated schedule","proof":"Build a checkerboard showing flying, reserve, maintenance, and unavailable periods; synchronize people, aircraft, tools, space, and capacity without conflicting assignments."},{"id":"S08","name":"Find and use genuine scheduling opportunities","proof":"Inspect idle windows and holes; fit eligible work after checking duration, dependencies, capability, and resources, and recognize when a gap must remain unfilled."},{"id":"S09","name":"Combine compatible work and reduce setup","proof":"Compare bundles and sequences that reduce repeated access, setup, changeovers, downtime, or cure only when supplied instructions permit; preserve every requirement and verify the actual time or capacity saved."}],"mission":1,"advanced":"scheduling:skill7","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"engine-11","section":"engine","group":"Engine Management","discipline":"engine","color":"#9b4515","title":"OG / MXG Coordination","moduleArea":"scheduling","moduleId":"recover","definition":"Explain the operational consequences of engine-management decisions to Operations and Maintenance leaders.","proof":"Offer choices that quantify mission effects, prerequisites, risk and decision authority.","pitfall":"Saying 'cannot support' without showing a recoverable option.","scenario":"Operations requests an extra mission that depends on a limited serviceable engine.","fundamentals":["Identify exactly what changed: ETIC, part arrival, mission demand, manpower or aircraft status.","Recompute what can fly, what can be maintained and what must move; distinguish feasible from desired output.","Coordinate with Production, Operations, MOC and specialists; capture alternatives, owners and due actions."],"related":[{"id":"S17","name":"Recover a disrupted schedule","proof":"After an outage, late part, changed requirement, or duration overrun, trace dependencies, test contingencies, restore feasibility, and communicate necessary changes while preserving unaffected commitments."},{"id":"S18","name":"Run a scheduling meeting that produces decisions","proof":"Prepare the plan and unresolved issues, reconcile stakeholder requirements, surface conflicts, record decisions and tradeoffs, and assign owners, deadlines, and follow-up actions."}],"mission":2,"advanced":"scheduling:skill8","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"dit_dbm-01","section":"dit_dbm","group":"Data Integrity / DBM","discipline":"dit_dbm","color":"#ae249d","title":"User Access","moduleArea":"dbm","moduleId":"access","definition":"Give users only approved access, roles and scope they need for the work, then review its continued need.","proof":"Verify requester identity, approval, correct role/scope, audit and later removal.","pitfall":"Copying the permissions of the most powerful user to solve a convenience problem.","scenario":"A trainee asks for administrator access to view a single report.","fundamentals":["Verify request, approving authority, required role and exact scope.","Grant only necessary permissions and test the intended user task.","Review effective access periodically and remove permissions after departure or reassignment."],"related":[{"id":"B04","name":"Translate duties into permissions","proof":"Build a role and scope matrix that permits approved work without unnecessary access."},{"id":"B05","name":"Provision authorized access","proof":"Link the correct identity, approved request, account, and permission scope; perform or route the action within assigned authority."},{"id":"B06","name":"Manage account lifecycle changes","proof":"Update access for arrivals, changed duties, departures, and expirations without accumulating obsolete permissions."},{"id":"B07","name":"Review effective access","proof":"Compare actual permissions, including supplied group inheritance, with current approvals and investigate discrepancies."},{"id":"B08","name":"Test access behavior","proof":"Verify that an authorized task succeeds and a specified unauthorized action remains restricted."}],"mission":7,"advanced":"dbm:skill1","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"dit_dbm-02","section":"dit_dbm","group":"Data Integrity / DBM","discipline":"dit_dbm","color":"#ae249d","title":"Data Integrity Team (DIT)","moduleArea":"integrity","moduleId":"authority","definition":"Protect maintenance data truthfulness and investigate source-versus-system disagreements.","proof":"Audit for accuracy, completeness, uniqueness, timing and provenance; document findings and accountable corrections.","pitfall":"Correcting a mismatch by guesswork without source evidence.","scenario":"A system shows 'inspected' while the approved source shows a valve was replaced.","fundamentals":["Identify the approved source for each field and its effective date.","Match stable aircraft, person or event identifiers instead of relying on a name.","Align report scope, unit and time period."],"related":[{"id":"I01","name":"Establish source authority","proof":"Identify the authoritative source for each field, including the applicable version and effective date."},{"id":"I02","name":"Establish record identity","proof":"Use stable identifiers for people, equipment, and events; investigate ambiguous identities instead of relying on matching names."},{"id":"I03","name":"Align scope and timing","proof":"Confirm that extracts cover the intended population and compatible dates before treating their differences as errors."}],"mission":6,"advanced":"integrity:skill2","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"dit_dbm-03","section":"dit_dbm","group":"Data Integrity / DBM","discipline":"dit_dbm","color":"#ae249d","title":"Subsystem Access","moduleArea":"dbm","moduleId":"access","definition":"Apply access scopes to the right application, subsystem, organization and task.","proof":"Demonstrate correct least-privilege grant with validation that the user can do the approved task only.","pitfall":"Granting permissions across unrelated units or records.","scenario":"A person can view one subsystem but needs an approved role in another.","fundamentals":["Verify request, approving authority, required role and exact scope.","Grant only necessary permissions and test the intended user task.","Review effective access periodically and remove permissions after departure or reassignment."],"related":[{"id":"B04","name":"Translate duties into permissions","proof":"Build a role and scope matrix that permits approved work without unnecessary access."},{"id":"B05","name":"Provision authorized access","proof":"Link the correct identity, approved request, account, and permission scope; perform or route the action within assigned authority."},{"id":"B06","name":"Manage account lifecycle changes","proof":"Update access for arrivals, changed duties, departures, and expirations without accumulating obsolete permissions."},{"id":"B07","name":"Review effective access","proof":"Compare actual permissions, including supplied group inheritance, with current approvals and investigate discrepancies."},{"id":"B08","name":"Test access behavior","proof":"Verify that an authorized task succeeds and a specified unauthorized action remains restricted."}],"mission":7,"advanced":"dbm:skill1","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"dit_dbm-04","section":"dit_dbm","group":"Data Integrity / DBM","discipline":"dit_dbm","color":"#ae249d","title":"Wing System Improvement","moduleArea":"dbm","moduleId":"change","definition":"Identify recurring defects in workflows or systems and manage an authorized change with verification.","proof":"Define user impact, root cause, proposed control, approval, test case and rollback plan.","pitfall":"Deploying a change without proving it addresses the problem or can be reversed.","scenario":"A report consistently hides an aircraft status due to a filter default.","fundamentals":["Identify affected settings, users and downstream interfaces.","Back up and test in a controlled environment when applicable.","Implement with approval, verify workflow, and preserve rollback/evidence."],"related":[{"id":"B14","name":"Control configuration changes","proof":"Assess affected workflows, obtain required authorization, test a scoped change, and preserve the previous configuration."},{"id":"B15","name":"Verify restoration and rollback","proof":"Demonstrate that a backup or rollback restores the required records, configuration, and usable workflow."}],"mission":7,"advanced":"dbm:skill5","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"dit_dbm-05","section":"dit_dbm","group":"Data Integrity / DBM","discipline":"dit_dbm","color":"#ae249d","title":"System Release Improvement","moduleArea":"dbm","moduleId":"change","definition":"Test and release a configuration/software improvement while protecting live records and continuity.","proof":"Document pre-change baseline, test, approval, deployment, rollback and post-change user verification.","pitfall":"Releasing a fix that solves one report but breaks imports.","scenario":"A new import mapping passes one test row but duplicates records after release.","fundamentals":["Identify affected settings, users and downstream interfaces.","Back up and test in a controlled environment when applicable.","Implement with approval, verify workflow, and preserve rollback/evidence."],"related":[{"id":"B14","name":"Control configuration changes","proof":"Assess affected workflows, obtain required authorization, test a scoped change, and preserve the previous configuration."},{"id":"B15","name":"Verify restoration and rollback","proof":"Demonstrate that a backup or rollback restores the required records, configuration, and usable workflow."}],"mission":7,"advanced":"dbm:skill5","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"dit_dbm-06","section":"dit_dbm","group":"Data Integrity / DBM","discipline":"dit_dbm","color":"#ae249d","title":"User Troubleshooting","moduleArea":"dbm","moduleId":"troubleshoot","definition":"Diagnose whether a complaint comes from access, filtering, bad data, an interface or a system outage.","proof":"Reproduce the complaint, isolate the layer, perform authorized fix/escalation, then rerun the task.","pitfall":"Resetting accounts or editing records before determining the actual cause.","scenario":"Three users cannot see a record for three different reasons.","fundamentals":["Reproduce the user task and expected output.","Check report filters and view scope, then data presence and permission.","Examine interface logs, error states and recent changes to locate the failing layer."],"related":[{"id":"B09","name":"Locate the failing layer","proof":"Use evidence to distinguish identity, permission, configuration, interface, application, or underlying service problems."},{"id":"B10","name":"Diagnose misleading views","proof":"Check filters, periods, scope, refresh state, and report settings before treating absent output as absent data."},{"id":"B11","name":"Reconstruct an incident","proof":"Correlate timestamps, transaction identifiers, logs, and user actions into a supported sequence of events."}],"mission":7,"advanced":"dbm:skill3","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"dit_dbm-07","section":"dit_dbm","group":"Data Integrity / DBM","discipline":"dit_dbm","color":"#ae249d","title":"Update DIT PowerPoint","moduleArea":"integrity","moduleId":"prevent","definition":"Turn recurring data-quality findings into concise trends, impacts and action-oriented briefings.","proof":"Show evidence, scale of defect, corrected/unresolved records, causes and preventive controls.","pitfall":"Reporting only errors found without separating confirmed fixes and open uncertainties.","scenario":"Monthly discrepancies drop but one critical record remains unresolved.","fundamentals":["Assign unresolved cases an owner and seek additional evidence or authority.","Identify recurring patterns and propose source validation rules or training fixes.","Retest controls on new examples and monitor whether the defect returns."],"related":[{"id":"I19","name":"Manage unresolved exceptions","proof":"Keep unresolved discrepancies, including conflicting current sources, with an owner and follow-up; obtain the needed evidence or authorized decision instead of inventing a value."},{"id":"I20","name":"Prevent recurring errors","proof":"Turn recurring defects into appropriate validation or reconciliation controls and demonstrate that those controls catch the intended problem."}],"mission":6,"advanced":"integrity:skill10","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"},{"id":"dit_dbm-08","section":"dit_dbm","group":"Data Integrity / DBM","discipline":"dit_dbm","color":"#ae249d","title":"User Help & Training","moduleArea":"dbm","moduleId":"workflow","definition":"Teach users accurate workflows, safe system use and where to get authoritative help.","proof":"Provide task-based guidance, a realistic exercise, appropriate escalation and evidence of task completion.","pitfall":"Telling people which buttons to press without teaching why/when a record is valid.","scenario":"A new user repeatedly miscodes the same record because the local guide is unclear.","fundamentals":["Define the user problem, expected workflow and acceptance condition.","Map key fields, identifiers, relationships and approved reference settings.","Check how a configuration change affects reports and downstream systems."],"related":[{"id":"B01","name":"Define the supported workflow","proof":"Translate an approved business need into users, inputs, operations, outputs, and observable acceptance conditions."},{"id":"B02","name":"Structure information for the workflow","proof":"Define necessary entities, identifiers, fields, relationships, and permitted values without needlessly duplicating the same fact."},{"id":"B03","name":"Maintain reference configuration","proof":"Apply approved changes to organizational units, resource categories, codes, or settings and verify the affected workflows."}],"mission":7,"advanced":"dbm:skill3","refNames":["DAFI 21-101 Ch. 5 and Ch. 14","AFI 21-101 ACCSUP Ch. 14"],"status":"source-based + working-group synthesis (not official certification)"}],"additions":[{"discipline":"scheduling","title":"Aircraft Capability vs Mission Need","module":"scheduling.daily","why":"Proposed shared foundational skill: distinguish FMC status from mission-specific capability; never schedule solely by a green status."},{"discipline":"scheduling","title":"Unplanned Breaks & Recovery","module":"scheduling.recover","why":"Proposed: rebuild flying and maintenance plans after NMCM/NMCS, part delays, launch aborts, or priority changes."},{"discipline":"scheduling","title":"90-Day Checkerboard Capstone","module":"scheduling.checkerboard","why":"Proposed: create, execute, revise and defend a 90-day fleet plan with real capacity limits."},{"discipline":"analysis","title":"Metric Denominators & Data Sources","module":"analysis.rates","why":"Proposed: compute break/fix/repeat/cann rates from raw events and document definitions."},{"discipline":"analysis","title":"Trends, Correlation & Root Cause","module":"analysis.drivers","why":"Proposed: separate signal from noise, test alternative causes and avoid unsupported causation."},{"discipline":"documentation","title":"Applicability → JML → Evidence","module":"documentation.jml","why":"Proposed: make an independent requirement/load/closeout audit with no invented completion evidence."},{"discipline":"documentation","title":"Cure and Combined Downtime","module":"documentation.forecast","why":"Proposed synthetic lesson: sequence PFR/PBG and required cure under supplied instructions; coordinate with Scheduling."},{"discipline":"engine","title":"Serial-Level Engine Control","module":"integrity.reconcile","why":"Proposed: follow one engine through installed, serviceable, restricted, removed and returned status."},{"discipline":"dit_dbm","title":"Independent Multi-Record Audit","module":"integrity.reconcile","why":"Proposed: find missing, duplicated, stale, inconsistent and correctly matching records without hints."},{"discipline":"dit_dbm","title":"Interface Failure and Recovery","module":"dbm.interface","why":"Proposed: distinguish mappings, accepted/rejected transactions, access and visibility, then verify recovery."},{"discipline":"all","title":"Communication and Decision Defense","module":"analysis.brief","why":"Shared competency: explain assumption, evidence, risk, alternatives and authorized action to a skeptical leader."},{"discipline":"all","title":"Delayed Retention & Supervisor Check","module":"scheduling.control","why":"Shared competency: repeat an unfamiliar case later; a game score alone never grants official qualification."}],"sources":{"CAFI 21-165 (historical CAF scheduling)":{"url":"https://static.e-publishing.af.mil/production/1/moodyafb/publication/combatairforceinstruction21-165_moodyafbsup/combat_air_force_instruction_21-165_moodyafbsup.pdf","note":"2015 Moody AFB supplement citing 2013 CAFI 21-165; archival reference, not confirmed current."},"AFI 21-101 ACCSUP Ch. 14":{"url":"https://static.e-publishing.af.mil/production/1/acc/publication/afi21-101_accsup/afi21-101_accsup.pdf","note":"ACC supplement includes 2025 guidance memorandum; verify current publication and supersession before operational use."},"ACCI 21-118 (2018 archive)":{"url":"https://static.e-publishing.af.mil/production/1/acc/publication/acci21-118/acci21-118.pdf","note":"2018 PDF retrievable; a 2026 revision is catalogued elsewhere and must be checked before operational use."},"DAFI 21-101 Ch. 5 and Ch. 14":{"url":"https://static.e-publishing.af.mil/production/1/af_a4/publication/dafi21-101/dafi21-101.pdf","note":"Parent maintenance instruction; check current changes/guidance memoranda."}},"notes":["Original five-column task inventory transcribed from supplied image002.png; labels made readable while retaining FGS/Wing organization.","100 Skills Working Draft (11 Nov 2026) and FLUX workshop (17 Nov 2026) are draft training inputs, not approved qualification standards.","SUTE, MSM, AFTO 103, AF Forms 2407/2410 are retained as task labels; verify exact current procedures before treating description as authoritative.","Earlier “FGP” abbreviation was normalized to Flying Hour Program (FHP).","Historical 21-165 and 2018 21-118 are teaching/source background, not assertions of current compliance."]};
